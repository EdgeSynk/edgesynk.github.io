<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for Filters and Gradients -->
    <defs>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
            <feOffset dx="2" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <linearGradient id="gradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
        </linearGradient>

        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#546E7A" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#F8F9FA" />

    <!-- Title -->
    <text x="600" y="50" font-family="Pretendard, 'Nanum Gothic', sans-serif" font-size="28" font-weight="bold" fill="#263238" text-anchor="middle">
        광학기반 3D 엣지모듈 안전감시 서비스 네트워크
    </text>

    <!-- 1. 현장 센싱 그룹 (Left) -->
    <rect x="50" y="160" width="280" height="340" rx="15" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="50" y="160" width="280" height="50" rx="15" fill="#1A237E" />
    <rect x="50" y="190" width="280" height="20" fill="#1A237E" /> <!-- Rect for rounding fix -->
    <text x="190" y="195" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">현장 센싱</text>

    <!-- Edge Module Box -->
    <rect x="80" y="240" width="220" height="120" rx="10" fill="url(#gradNavy)" filter="url(#dropShadow)" />
    <text x="190" y="275" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">광학기반 3D 엣지모듈</text>
    <text x="190" y="305" font-family="sans-serif" font-size="14" fill="#B2EBF2" text-anchor="middle">3D 측정 · 위험상황 판단</text>

    <!-- Components -->
    <g transform="translate(190, 380)">
        <rect x="-100" y="0" width="200" height="80" rx="8" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1" />
        <text x="0" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#455A64" text-anchor="middle">Sensing Components</text>
        <text x="0" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0097A7" text-anchor="middle">LiDAR / Camera / AI Edge</text>
    </g>

    <!-- 2. 무선통신망 (Center) -->
    <circle cx="480" cy="330" r="60" fill="white" stroke="#00BCD4" stroke-width="3" filter="url(#dropShadow)" />
    <!-- WiFi Icon representation -->
    <path d="M460 345 A 30 30 0 0 1 500 345 M455 335 A 40 40 0 0 1 505 335 M450 325 A 50 50 0 0 1 510 325" fill="none" stroke="#00BCD4" stroke-width="4" stroke-linecap="round" />
    <circle cx="480" cy="355" r="4" fill="#00BCD4" />
    <text x="480" y="415" font-family="sans-serif" font-size="16" font-weight="bold" fill="#263238" text-anchor="middle">무선통신망 (Wi-Fi)</text>

    <!-- 3. 데이터베이스 서버 (Middle-Right) -->
    <rect x="650" y="240" width="220" height="180" rx="12" fill="white" stroke="#1A237E" stroke-width="2" filter="url(#dropShadow)" />
    <!-- Server Icon representation -->
    <rect x="730" y="260" width="60" height="15" rx="2" fill="#CFD8DC" />
    <rect x="730" y="280" width="60" height="15" rx="2" fill="#CFD8DC" />
    <rect x="730" y="300" width="60" height="15" rx="2" fill="#CFD8DC" />

    <text x="760" y="350" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1A237E" text-anchor="middle">데이터베이스 서버</text>
    <line x1="680" y1="365" x2="840" y2="365" stroke="#E0E0E0" stroke-width="1" />
    <text x="760" y="390" font-family="sans-serif" font-size="14" fill="#546E7A" text-anchor="middle">데이터 전송 · 저장</text>
    <text x="760" y="408" font-family="sans-serif" font-size="14" fill="#546E7A" text-anchor="middle">이력관리</text>

    <!-- 4. 관리자 대시보드 (Top Right) -->
    <rect x="950" y="150" width="200" height="110" rx="10" fill="url(#gradNavy)" filter="url(#dropShadow)" />
    <text x="1050" y="185" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">안전관제</text>
    <text x="1050" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">관리자 대시보드</text>
    <text x="1050" y="235" font-family="sans-serif" font-size="13" fill="#B2EBF2" text-anchor="middle">모니터링 · 이벤트 조회</text>

    <!-- 5. 가입자 앱 (Bottom Right) -->
    <rect x="950" y="400" width="200" height="110" rx="10" fill="white" stroke="#00BCD4" stroke-width="2" filter="url(#dropShadow)" />
    <text x="1050" y="435" font-family="sans-serif" font-size="17" font-weight="bold" fill="#00838F" text-anchor="middle">가입자 앱</text>
    <text x="1050" y="460" font-family="sans-serif" font-size="13" fill="#546E7A" text-anchor="middle">휴대폰망 기반 알림서비스</text>

    <!-- 6. Push 알림 보조 라벨 -->
    <rect x="980" y="475" width="140" height="25" rx="12" fill="#E0F7FA" />
    <text x="1050" y="492" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00BCD4" text-anchor="middle">SMS / Push / App 알림</text>

    <!-- 7, 8, 9 Arrows and Labels -->

    <!-- Edge to WiFi -->
    <path d="M330 330 L410 330" fill="none" stroke="#546E7A" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="370" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#455A64" text-anchor="middle">데이터 전송</text>

    <!-- WiFi to Server -->
    <path d="M540 330 L640 330" fill="none" stroke="#546E7A" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="590" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#455A64" text-anchor="middle">측정/판단 결과 전송</text>

    <!-- Server to Dashboard (Up) -->
    <path d="M870 300 Q 910 300, 910 240 L 940 240" fill="none" stroke="#546E7A" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowhead)" />
    <text x="910" y="280" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A237E" text-anchor="end">실시간 상태/이력 조회</text>

    <!-- Server to App (Down) -->
    <path d="M870 360 Q 910 360, 910 420 L 940 420" fill="none" stroke="#D84315" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="910" y="385" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D84315" text-anchor="end">위험 이벤트 알림</text>

    <!-- Footer Decor -->
    <line x1="50" y1="620" x2="1150" y2="620" stroke="#ECEFF1" stroke-width="2" />
</svg>
